server {
    server_name api.tecorb.in;

    location / {
        proxy_pass http://127.0.0.1:3018;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.tecorb.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tecorb.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = api.tecorb.in) {
        return 301 https://$host$request_uri;
    }

    server_name api.tecorb.in;
    listen 80;
    return 404;
}
